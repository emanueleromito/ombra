[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "ombra"
version = "0.1.0"
description = "Client for Ombra, a vector database with fully homomorphic encryption"
requires-python = ">=3.12,<3.13"  # local mode is built for 3.12 only until wheels for other versions ship
dependencies = ["numpy", "cryptography", "faiss-cpu"]

[project.scripts]
ombra-recall = "ombra.recall:main"

[project.optional-dependencies]
local = ["openfhe==1.6.1.0.24.4", "protobuf", "grpcio-tools"]
grpc = ["openfhe==1.6.1.0.24.4", "grpcio", "grpcio-tools"]
langchain = ["langchain-core"]

[tool.scikit-build]
wheel.packages = ["ombra"]
cmake.build-type = "Release"
minimum-version = "build-system.requires"
