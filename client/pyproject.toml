[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ombra"
version = "0.1.0"
description = "Client for Ombra, a vector database with fully homomorphic encryption"
requires-python = ">=3.11"
dependencies = ["numpy", "cryptography", "faiss-cpu"]

[project.optional-dependencies]
local = ["openfhe", "protobuf", "grpcio-tools"]
grpc = ["grpcio", "grpcio-tools"]
langchain = ["langchain-core"]

[tool.setuptools]
packages = ["ombra"]

[tool.setuptools.package-data]
ombra = ["resources/*"]
