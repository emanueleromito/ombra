// Ombra gRPC API, version 1 (package ombra.v1).
//
// The secret key stays on the client: no message has a field for it, and none may get one. The
// server receives ciphertexts (in the versioned envelope) and public evaluation keys only. Ids are
// opaque bytes chosen by the client; documents and metadata values never appear in any message.
// Version rule: every message that the server stores carries `api_version`; the server refuses a
// stored-message value other than 1 with ERROR_UNSUPPORTED_VERSION. A new incompatible API gets
// a new package (ombra.v2), not a changed field.
syntax = "proto3";

package ombra.v1;

// Constants shared by client and server. Values are the limits; use them as ints.
enum Limit {
  LIMIT_UNSPECIFIED = 0;
  LIMIT_API_VERSION = 1;
  LIMIT_MAX_CHUNK_BYTES = 4194304;      // one `bytes` payload of a chunk
  LIMIT_MAX_NAME_BYTES = 128;           // collection name
  LIMIT_MAX_ID_BYTES = 256;             // one vector id
  LIMIT_MAX_IDS_PER_REQUEST = 100000;   // delete ids, round 2 ids
  LIMIT_MAX_FILTER_FIELDS = 16;         // F; the preset's headroom may lower it (see below)
  LIMIT_MAX_FILTER_CARDINALITY = 64;    // values per field (higher cardinality is hashed)
  LIMIT_MAX_CLUSTERS_PER_ROUND = 4096;
  // Encrypted blob sizes: a stored blob is exactly one of these sizes, never another, so
  // the server learns only the bucket of a document, not its size. Larger files are kept in the
  // customer's own storage and the blob holds an encrypted reference.
  LIMIT_BLOB_BUCKET_0 = 16384;
  LIMIT_BLOB_BUCKET_1 = 262144;
  LIMIT_BLOB_BUCKET_2 = 2097152;
  LIMIT_BLOB_BUCKET_3 = 16777216;
}

enum ErrorCode {
  ERROR_UNSPECIFIED = 0;
  ERROR_UNSUPPORTED_VERSION = 1;    // api_version or envelope version not understood
  ERROR_COLLECTION_NOT_FOUND = 2;
  ERROR_COLLECTION_EXISTS = 3;
  ERROR_INVALID_ARGUMENT = 4;       // malformed message, empty required field
  ERROR_SIZE_LIMIT = 5;             // a Limit was exceeded
  ERROR_KEY_TAG_MISMATCH = 6;       // ciphertext or key made under another key than the collection's
  ERROR_PRESET_MISMATCH = 7;        // envelope preset differs from the collection's
  ERROR_INVALID_FILTER_LAYOUT = 8;  // filter fields above the limits or above the preset's headroom
  ERROR_KEYS_MISSING = 9;           // search or insert before the evaluation keys were uploaded
  ERROR_BAD_SEQUENCE = 10;          // stream messages out of order
  ERROR_INTERNAL = 11;
  ERROR_BLOCK_NOT_FOUND = 12;       // no such block (segment) in the collection
  ERROR_BLOCK_MISMATCH = 13;        // ReplaceBlock ids are not exactly the live ids, or cluster/columns differ
  ERROR_BLOB_NOT_FOUND = 14;        // no blob with this (kind, id) in the collection
  ERROR_STORAGE_FULL = 15;          // the server's disk or quota is full; nothing was stored; retry later
}

message Error {
  ErrorCode code = 1;
  string message = 2;  // never contains ids, ciphertext bytes or values
}

enum SecurityLevel {
  SECURITY_LEVEL_UNSPECIFIED = 0;
  SECURITY_LEVEL_FAST = 1;
  SECURITY_LEVEL_DECOY = 2;
  SECURITY_LEVEL_STRICT = 3;
}

// One filter field. The server sees only the number of fields and their value
// counts; names stay on the client. A one-hot column per value is stored for every vector.
message FilterField {
  uint32 field_id = 1;     // 0, 1, ... in order; opaque, not a name
  uint32 cardinality = 2;  // number of values (1 .. LIMIT_MAX_FILTER_CARDINALITY)
}

// Stored in the catalog.
message CollectionSpec {
  uint32 api_version = 1;           // must be 1
  string name = 2;
  string preset = 3;                // "m0_depth2" or "m0_compact_n8192"
  uint32 dimension = 4;             // d, vector dimension
  SecurityLevel security_level = 5;
  repeated FilterField filter_fields = 6;
  string key_tag = 7;               // public key tag of the client's key (not secret)
  uint32 cluster_count = 8;
}

// The query ciphertext carries dimension + sum(cardinality) entries.
message CreateCollectionRequest { CollectionSpec spec = 1; }
message CreateCollectionResponse { oneof result { CollectionSpec spec = 1; Error error = 2; } }

message GetCollectionRequest { string name = 1; }
message GetCollectionResponse {
  oneof result { CollectionInfo info = 1; Error error = 2; }
}

message CollectionInfo {
  CollectionSpec spec = 1;
  uint64 vector_count = 2;
  uint64 deleted_count = 3;
  bool keys_uploaded = 4;
}

message ListCollectionsRequest {}
message ListCollectionsResponse { repeated CollectionInfo collections = 1; }

message DropCollectionRequest { string name = 1; }
message DropCollectionResponse { Error error = 1; }  // unset on success

// Evaluation keys (public): multiplication key and automorphism keys, in versioned envelopes. Sent as
// a client stream of chunks; `kind` says which file the bytes belong to.
enum KeyKind {
  KEY_KIND_UNSPECIFIED = 0;
  KEY_KIND_CONTEXT = 1;
  KEY_KIND_EVAL_MULT = 2;
  KEY_KIND_AUTOMORPHISM = 3;
}

message UploadKeysChunk {
  uint32 api_version = 1;  // must be 1 (the keys are stored)
  string collection = 2;   // required on the first chunk
  KeyKind kind = 3;
  uint64 offset = 4;       // byte offset within this key file
  bytes data = 5;          // at most LIMIT_MAX_CHUNK_BYTES
  bool last = 6;           // last chunk of this kind
}
message UploadKeysResponse { Error error = 1; }

// Insert: a client stream of blocks, sent in parts like ReplaceBlock so that no message is larger
// than one column. A block is up to batch_size vectors of one cluster: d column ciphertexts +
// sum(cardinality) one-hot ciphertexts, each in a versioned envelope. Per block: one header, then
// its columns in column order, one per message. The next header (or the end of the stream) closes
// the block; a block with fewer or more columns than the layout needs is ERROR_BAD_SEQUENCE.
// A block is stored when it is closed; `inserted` counts the stored blocks' ids.
//
// Idempotent: a block whose ids ALL exist in one stored block of the same cluster, with
// byte-identical column envelopes, is a success that stores nothing and counts its ids again, so a
// client may repeat an Insert whose answer it never got. A block that shares only some ids with
// stored ones, or reuses an id with other bytes, is refused as a duplicate.
message InsertHeader {
  string collection = 1;
  uint32 cluster_id = 2;
  repeated bytes ids = 3;       // one per occupied slot, in slot order; at most one block of slots
  bool is_center = 4;           // cluster-center block (stage 1) instead of data
}
message InsertRequest {
  uint32 api_version = 1;       // must be 1 (the block is stored)
  oneof part { InsertHeader header = 2; bytes column = 3; }
}
// One whole block: the form that the local mode stores. No call sends it.
message InsertBlock {
  uint32 api_version = 1;
  string collection = 2;
  uint32 cluster_id = 3;
  repeated bytes ids = 4;       // one per occupied slot, in slot order
  repeated bytes columns = 5;   // dimension + sum(cardinality) envelopes, in that column order
  bool is_center = 6;           // cluster-center block (stage 1) instead of data
}
message InsertResponse { uint64 inserted = 1; Error error = 2; }

message DeleteRequest {
  uint32 api_version = 1;  // must be 1 (tombstones are stored)
  string collection = 2;
  repeated bytes ids = 3;
}
message DeleteResponse { uint64 deleted = 1; Error error = 2; }

// Search: one bidirectional stream. The query ciphertext is sent once and the server expands it
// once. Round 1 returns center scores; round 2 is a SearchChosen answered by
// SearchScores messages ending with `last`. A client may send further SearchChosen messages on
// the same stream (a selective filter needs more clusters); each reuses the
// expansion. The client half-closes to end the stream.
message SearchStart {
  string collection = 1;
  string key_tag = 2;                 // checked against the collection's
  bytes query = 3;                    // one versioned envelope; dimension + sum(cardinality) entries
  uint32 filter_leaves = 4;           // sum(cardinality); the server checks it against the spec
}
message SearchCenterScores {          // round 1 out: stage-1 scores, one ciphertext per block
  repeated bytes score_blocks = 1;    // versioned envelopes, each decrypts to one score per slot
  uint32 center_count = 2;
}
message SearchChosen {                // round 2 in: chosen clusters (real and decoy, indistinguishable)
  repeated uint32 cluster_ids = 1;    // at most LIMIT_MAX_CLUSTERS_PER_ROUND
}
message SearchScores {                // round 2 out: filtered scores and the ids they belong to
  uint32 cluster_id = 1;
  repeated bytes score_blocks = 2;    // each: slot i holds score + lambda * c
  repeated bytes ids = 3;             // slot order within the cluster, tombstoned slots included
  bool last = 4;                      // last message of the stream
  repeated uint32 block_sizes = 5;    // occupied slots of each score block, in block order;
                                      // they sum to the number of ids, so an answer
                                      // describes itself (blocks may change between answers)
}
message SearchRequest {
  oneof step { SearchStart start = 1; SearchChosen chosen = 2; }
}
message SearchResponse {
  oneof step { SearchCenterScores centers = 1; SearchScores scores = 2; Error error = 3; }
}

// Blocks (storage segments) and their upkeep. A deleted vector is one slot in every column of its
// block, so the server cannot drop single slots; it drops blocks whose vectors are ALL deleted, and
// the client repacks a block with many deleted slots: GetBlock, decrypt, drop the deleted slots,
// re-encrypt, ReplaceBlock. The server never sees keys or plaintext. Counts only below, no ids.
message BlockInfo {
  string segment = 1;      // segment name: opaque, stable until the block is replaced or dropped
  uint32 cluster_id = 2;   // == cluster_count for center blocks
  uint64 n_vectors = 3;    // occupied slots, deleted ones included
  uint64 n_deleted = 4;
}
message ListBlocksRequest { uint32 api_version = 1; string collection = 2; }
message ListBlocksResponse { uint32 api_version = 1; repeated BlockInfo blocks = 2; Error error = 3; }

message GetBlockRequest { uint32 api_version = 1; string collection = 2; string segment = 3; }
message BlockHeader {
  uint32 cluster_id = 1;
  repeated bytes ids = 2;       // slot order
  repeated bool deleted = 3;    // parallel to ids: tombstoned at this instant
  uint32 n_columns = 4;         // the column messages that follow
}
// Stream: one header, then n_columns messages with `column` (versioned envelopes, in column order).
message GetBlockResponse {
  uint32 api_version = 1;
  oneof part { BlockHeader header = 2; bytes column = 3; Error error = 4; }
}

message ReplaceBlockHeader {
  string collection = 1;
  repeated string segments = 2;  // 1..N blocks of ONE data cluster (from ListBlocks / GetBlock)
  repeated bytes ids = 3;        // exactly the union of their LIVE ids, in the new slot order;
                                 // at most one block of slots
}
// Client stream: one header, then the columns in column order (same layout as the old blocks).
// N old blocks become ONE new block, so the stored bytes fall by N-1 blocks.
message ReplaceBlockRequest {
  uint32 api_version = 1;   // must be 1 (the block is stored)
  oneof part { ReplaceBlockHeader header = 2; bytes column = 3; }
}
message ReplaceBlockResponse {
  uint32 api_version = 1;
  string segment = 2;       // name of the new block
  Error error = 3;
}

// Encrypted blob store. Blobs are opaque client ciphertexts (the client's versioned
// document layout); the server never parses them. Keyed by (collection, kind, id). The size of
// every blob must be one of the LIMIT_BLOB_BUCKET_* values, else ERROR_SIZE_LIMIT. Same storage
// and crash-safety rules as segments: a blob is visible only after it is fully written, synced
// and committed in the catalog; a crash leaves either the old blob or the new one, never a part.
enum BlobKind {
  BLOB_KIND_UNSPECIFIED = 0;
  BLOB_KIND_RECORD = 1;     // per-vector record: encrypted vector copy and metadata
  BLOB_KIND_DOCUMENT = 2;   // document body, or an encrypted reference to the customer's storage
}
message PutBlobHeader {
  string collection = 1;
  BlobKind kind = 2;
  bytes id = 3;              // at most LIMIT_MAX_ID_BYTES
  uint64 size = 4;           // total bytes that follow; must be a bucket size
}
// Client stream: one header, then `data` chunks (each at most LIMIT_MAX_CHUNK_BYTES) whose
// lengths sum to `size`. An existing blob with the same key is replaced atomically.
message PutBlobRequest {
  uint32 api_version = 1;    // must be 1 (the blob is stored)
  oneof part { PutBlobHeader header = 2; bytes data = 3; }
}
message PutBlobResponse { uint32 api_version = 1; Error error = 2; }

message GetBlobRequest { uint32 api_version = 1; string collection = 2; BlobKind kind = 3; bytes id = 4; }
// Server stream: `size` first, then `data` chunks in order.
message GetBlobResponse {
  uint32 api_version = 1;
  oneof part { uint64 size = 2; bytes data = 3; Error error = 4; }
}

message DeleteBlobsRequest {
  uint32 api_version = 1;
  string collection = 2;
  BlobKind kind = 3;
  repeated bytes ids = 4;    // at most LIMIT_MAX_IDS_PER_REQUEST; missing ids are not an error
}
message DeleteBlobsResponse { uint64 deleted = 1; Error error = 2; }

service Ombra {
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  rpc GetCollection(GetCollectionRequest) returns (GetCollectionResponse);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc DropCollection(DropCollectionRequest) returns (DropCollectionResponse);
  rpc UploadKeys(stream UploadKeysChunk) returns (UploadKeysResponse);
  rpc Insert(stream InsertRequest) returns (InsertResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Search(stream SearchRequest) returns (stream SearchResponse);
  rpc ListBlocks(ListBlocksRequest) returns (ListBlocksResponse);
  rpc GetBlock(GetBlockRequest) returns (stream GetBlockResponse);
  rpc ReplaceBlock(stream ReplaceBlockRequest) returns (ReplaceBlockResponse);
  rpc PutBlob(stream PutBlobRequest) returns (PutBlobResponse);
  rpc GetBlob(GetBlobRequest) returns (stream GetBlobResponse);
  rpc DeleteBlobs(DeleteBlobsRequest) returns (DeleteBlobsResponse);
}
