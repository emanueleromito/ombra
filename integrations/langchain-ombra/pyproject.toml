[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "langchain-ombra"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0 OR LicenseRef-Ombra-Commercial"
license-files = ["LICENSE"]
description = "LangChain VectorStore for Ombra, a vector database with fully homomorphic encryption"
requires-python = ">=3.11"
dependencies = ["ombra==0.1.0", "langchain-core>=0.3,<2", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest", "langchain-tests"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_ombra"]
