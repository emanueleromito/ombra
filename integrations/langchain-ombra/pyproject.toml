[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-ombra"
version = "0.1.0"
description = "LangChain VectorStore for Ombra, a vector database with fully homomorphic encryption"
requires-python = ">=3.11"
dependencies = ["ombra", "langchain-core>=0.3", "numpy"]

[project.optional-dependencies]
test = ["pytest", "langchain-tests"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_ombra"]
