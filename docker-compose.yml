# Starts the Ombra GPU server. Needs Docker, an NVIDIA GPU (Turing to Hopper: sm_75, 80, 86, 89, 90) and the
# NVIDIA container toolkit.
#
#   docker compose up -d
#   docker compose exec ombra cat /data/admin_api_key    # the admin API key, made on the first start
#   docker compose cp ombra:/data/tls/server.crt ./server.crt    # the certificate, for clients
#
# Collections, the API key file and the certificate live in the named volume "ombra-data", so they
# survive `docker compose down`. `docker compose down -v` deletes them. Back the volume up.
# The server has no secrets in this file: the API key is made on the first start and kept in the
# volume. The image tag is set with OMBRA_VERSION (default 0.1.0).
name: ombra

services:
  ombra:
    image: ghcr.io/erailabs/ombra-server:${OMBRA_VERSION:-0.1.0}
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    ports:
      # Published on this machine only. To serve other machines, set OMBRA_BIND=0.0.0.0 on purpose.
      - "${OMBRA_BIND:-127.0.0.1}:50051:50051"  # gRPC
      - "127.0.0.1:8080:8080"  # REST admin and metrics, on this machine only
    volumes:
      - ombra-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # The server needs no privileges and writes only to /data and /tmp.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # The gRPC port accepts connections (bash opens the TCP port; the image has no curl).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/50051"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  ombra-data:
