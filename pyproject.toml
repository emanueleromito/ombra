# Repository-wide Python tool settings. The client package gets its own pyproject.toml in client/.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "build-cpu", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"modal_app.py" = ["S603", "S607"]  # subprocess calls with fixed arguments
"tests/test_gpu_*.py" = ["S603", "S607"]  # tests run built drivers and openssl with fixed arguments
"integrations/*/tests/*.py" = ["S106"]  # synthetic passphrases in tests
"integrations/*/examples/*.py" = ["S106"]  # the example uses a placeholder passphrase
"examples/*.py" = ["S106"]  # the examples use a placeholder passphrase

[tool.pytest.ini_options]
testpaths = ["tests", "client", "core", "integrations", "docs"]
pythonpath = ["client", "integrations/langchain-ombra"]
markers = [
    "openfhe: needs openfhe-python; runs in the pinned image on Modal via `make test-openfhe`",
    "gpu: needs a CUDA GPU; runs on Modal via `make test-gpu`",
    "slow: large sizes; run via `make bench`, not in normal tests",
]
addopts = "-ra"
asyncio_mode = "auto"  # LangChain's async standard tests (integrations/); needs pytest-asyncio
