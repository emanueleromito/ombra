version: 2
updates:
  - package-ecosystem: pip
    directory: /client
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /integrations/langchain-ombra
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /ci
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      # Stay on the Ubuntu LTS release; move to the next LTS by hand.
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
