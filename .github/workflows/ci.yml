# T1.19: the oracle tests run on every PR. Make "CPU tests" and "GPU oracles" required checks on
# main. Secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET are repository secrets; they are not available
# to PRs from forks, so "GPU oracles" fails there when the PR touches the code it covers.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu:
    name: CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make venv
      - run: .venv/bin/python -m pip install --quiet numpy
      - run: make test

  gpu:
    # Always runs, so the required check reports on every PR; the work is skipped if nothing relevant
    # changed. tests/ and the Modal files count, since changing them can weaken an oracle.
    name: GPU oracles
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: gpu-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        run: |
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qE '^(core/|tests/|client/|modal_app\.py|modal_upload\.py|CMakeLists\.txt)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No change to the code the GPU oracles cover; skipping."
          fi
      - if: steps.changes.outputs.run == 'true'
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::MODAL_TOKEN_ID and MODAL_TOKEN_SECRET are not set for this run."
            exit 1
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: steps.changes.outputs.run == 'true'
        run: python -m pip install --quiet modal==1.6.3
      - if: steps.changes.outputs.run == 'true'
        run: make test-gpu
