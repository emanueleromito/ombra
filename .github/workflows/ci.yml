# CPU tests run on every PR. The GPU oracles (Modal) run only when triggered by hand
# (workflow_dispatch, "Run workflow" on the Actions tab, choosing the branch), to limit Modal cost;
# on PRs the job is skipped, which a required check treats as passing. Secrets MODAL_TOKEN_ID and
# MODAL_TOKEN_SECRET are repository secrets.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make venv
      - run: .venv/bin/python -m pip install --quiet numpy grpcio-tools
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - run: make test

  gpu:
    # Manual only (workflow_dispatch). Run it on a branch before merging any change to core/,
    # tests/, client/ or the Modal files, since those can weaken an oracle.
    name: GPU oracles
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: gpu-${{ github.ref }}
      cancel-in-progress: true
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::MODAL_TOKEN_ID and MODAL_TOKEN_SECRET are not set for this run."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet modal==1.6.3
      - run: make test-gpu
