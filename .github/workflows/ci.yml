# Checks on every pull request to dev or main and on every push to dev, on GitHub runners only: no
# Modal, no GPU. The jobs run inside the CI image (ci/Dockerfile), which has OpenFHE 1.6.1. The
# first job finds the image for the current Dockerfile in GHCR, or builds it if it is missing.
# GPU tests are in gpu.yml.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: CI image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yml

  lint:
    name: Lint
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make lint

  cpu:
    name: CPU build and tests
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make build-cpu
      - run: make test

  openfhe:
    name: OpenFHE tests
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make test-openfhe-local

  upgrade:
    name: Upgrade tests
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Full history and tags: the tests look for the highest v* tag below HEAD. With no tag they
      # skip (the first release is v0.1.0). The previous release's CPU server is built on every
      # run; no actions/cache is used anywhere in this repository yet, so none is added here.
      # OMBRA_UPGRADE_CACHE is where a cache would go.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make test-upgrade
