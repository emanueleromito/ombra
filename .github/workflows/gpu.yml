# GPU tests (make test-gpu) on Modal, on an A10. Runs by hand ("Run workflow" on the Actions tab,
# choosing the branch) and every night on the default branch. Never on pull requests: Modal costs
# money and a PR from a fork must not get the tokens. Run it on a branch before merging any change
# to core/, tests/, client/ or the Modal files, since those can weaken an oracle.
# MODAL_TOKEN_ID and MODAL_TOKEN_SECRET are repository secrets.
name: GPU tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  gpu:
    name: GPU oracles
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: gpu-${{ github.ref }}
      cancel-in-progress: true
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::MODAL_TOKEN_ID and MODAL_TOKEN_SECRET are not set for this run."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet modal==1.6.3
      - run: make test-gpu
