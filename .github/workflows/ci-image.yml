# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0 OR LicenseRef-Ombra-Commercial
# Builds the CI image (ci/Dockerfile) and pushes it to GHCR, tagged with a hash of the files it is
# built from. If that tag is already in GHCR the job does nothing, so a normal PR run does not build
# OpenFHE. Runs when ci/Dockerfile or ci/requirements.txt change on dev, on manual dispatch (use
# "force" to rebuild the current tag), and as the first job of ci.yml, so a PR that changes the
# Dockerfile builds its own image before the tests run.
name: CI image

on:
  push:
    branches: [dev]
    paths:
      - ci/Dockerfile
      - ci/requirements.txt
      - .github/workflows/ci-image.yml
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and push even if the tag exists
        type: boolean
        default: false
  workflow_call:
    outputs:
      image:
        description: Full name of the CI image for these file contents
        value: ${{ jobs.image.outputs.image }}

permissions:
  contents: read

jobs:
  image:
    name: Build CI image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: tag
        run: |
          repo=$(echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/ombra-ci" | tr '[:upper:]' '[:lower:]')
          hash=$(cat ci/Dockerfile ci/requirements.txt | sha256sum | cut -c1-16)
          echo "image=${repo}:${hash}" >> "$GITHUB_OUTPUT"

      # Pull requests from forks get a read-only token: they can pull the image but not push one.
      - id: can_push
        env:
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo "push=$([ "$FORK" = true ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: exists
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" != true ] && docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE already exists, not rebuilding"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.found == 'false' && steps.can_push.outputs.push == 'false'
        run: |
          echo "::error::The CI image for these Dockerfile contents is not in GHCR yet, and a pull request from a fork cannot push it. A maintainer must run the 'CI image' workflow on a branch with these files."
          exit 1

      - if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@v4

      - if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ci/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
